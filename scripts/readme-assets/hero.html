<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>aicommits hero</title>
<link rel="stylesheet" href="shared.css">
<style>
	:root { --w: 1280px; --h: 680px; }

	.hero {
		position: relative;
		z-index: 1;
		display: flex;
		flex-direction: column;
		align-items: center;
		text-align: center;
		gap: 28px;
		padding: 0 48px;
	}

	.mark {
		width: 88px;
		height: 88px;
		border-radius: 22px;
		background: linear-gradient(160deg, #222228 0%, #121214 100%);
		border: 1px solid rgba(255, 255, 255, 0.08);
		box-shadow:
			0 20px 50px rgba(0, 0, 0, 0.55),
			0 0 0 1px rgba(255, 255, 255, 0.04) inset;
		display: grid;
		place-items: center;
		align-content: center;
		gap: 5px;
		color: #fff;
	}
	.mark .letters { font-weight: 700; font-size: 30px; letter-spacing: -0.03em; line-height: 1; }
	.mark .glyphs { display: flex; align-items: center; gap: 14px; }
	.mark .chev {
		width: 10px; height: 10px;
		border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff;
		transform: rotate(45deg);
		margin-left: 3px;
	}
	.mark .ball { width: 11px; height: 11px; border-radius: 50%; background: #fff; }

	.title-row { display: flex; align-items: center; gap: 14px; }
	h1 {
		font-size: 78px;
		font-weight: 700;
		letter-spacing: -0.05em;
		line-height: 1;
	}
	.version {
		font-family: var(--mono);
		font-size: 20px;
		font-weight: 600;
		color: var(--ink);
		background: linear-gradient(120deg, #fdba74, #f472b6 55%, #93b4ff);
		padding: 5px 11px;
		border-radius: 9px;
		transform: translateY(-3px);
	}

	.tagline {
		font-size: 28px;
		font-weight: 500;
		letter-spacing: -0.02em;
		color: var(--text);
		max-width: 860px;
		line-height: 1.3;
	}
	.tagline em {
		font-style: normal;
		color: var(--muted);
		font-size: 20px;
		font-weight: 400;
		display: block;
		margin-top: 10px;
		letter-spacing: -0.01em;
	}

	.logos {
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		gap: 12px;
		max-width: 980px;
		margin-top: 4px;
	}
	.logo {
		display: inline-flex;
		align-items: center;
		gap: 12px;
		min-width: 210px;
		padding: 12px 18px 12px 14px;
		border-radius: 16px;
		border: 1px solid rgba(255, 255, 255, 0.08);
		background: rgba(18, 18, 22, 0.72);
		backdrop-filter: blur(12px);
		box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
		text-align: left;
	}
	.logo .icon {
		width: 40px;
		height: 40px;
		border-radius: 11px;
		display: grid;
		place-items: center;
		flex-shrink: 0;
		background: rgba(255, 255, 255, 0.06);
		border: 1px solid rgba(255, 255, 255, 0.06);
	}
	.logo .icon img,
	.logo .icon svg {
		width: 22px;
		height: 22px;
		display: block;
	}
	.logo .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
	.logo .name { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; color: #fff; line-height: 1.2; }
	.logo .hint { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: -0.01em; }
	.logo.sub .hint { color: var(--green); }
	.logo.rec .icon {
		background: linear-gradient(145deg, rgba(239, 44, 193, 0.18), rgba(252, 76, 2, 0.18));
		border-color: rgba(252, 76, 2, 0.25);
	}

	.cmd {
		font-family: var(--mono);
		font-size: 17px;
		color: var(--muted);
		background: rgba(255, 255, 255, 0.04);
		border: 1px solid var(--panel-edge);
		border-radius: 12px;
		padding: 11px 20px;
		margin-top: 2px;
	}
	.cmd .p { color: var(--faint); margin-right: 10px; }
	.cmd .c { color: var(--text); }
</style>
</head>
<body>
<div class="stage">
	<div class="hero">
		<div class="mark" aria-hidden="true">
			<div class="letters">AIC</div>
			<div class="glyphs"><span class="chev"></span><span class="ball"></span></div>
		</div>
		<div class="title-row">
			<h1>aicommits</h1>
			<span class="version">v5</span>
		</div>
		<p class="tagline">
			Commit messages written by the AI you already pay for.
			<em>Claude, Codex, OpenCode Go, or Together AI — no new account required.</em>
		</p>
		<div class="logos" aria-label="Supported providers">
			<div class="logo sub">
				<span class="icon" aria-hidden="true">
					<img src="logos/anthropic.svg" alt="" style="filter: invert(1);">
				</span>
				<span class="meta">
					<span class="name">Anthropic · Claude</span>
					<span class="hint">subscription</span>
				</span>
			</div>
			<div class="logo sub">
				<span class="icon" aria-hidden="true">
					<img src="logos/openai.svg" alt="" style="filter: invert(1);">
				</span>
				<span class="meta">
					<span class="name">OpenAI · Codex</span>
					<span class="hint">subscription</span>
				</span>
			</div>
			<div class="logo sub">
				<span class="icon" aria-hidden="true" style="color:#fff">
					<img src="logos/opencode.svg" alt="" style="filter: invert(1);">
				</span>
				<span class="meta">
					<span class="name">OpenCode Go</span>
					<span class="hint">subscription</span>
				</span>
			</div>
			<div class="logo rec">
				<span class="icon" aria-hidden="true">
					<img src="logos/together.svg" alt="">
				</span>
				<span class="meta">
					<span class="name">Together AI</span>
					<span class="hint">recommended API</span>
				</span>
			</div>
		</div>
		<div class="cmd"><span class="p">$</span><span class="c">npm i -g aicommits &amp;&amp; aicommits setup</span></div>
	</div>
</div>
</body>
</html>
